# gitleaks config — CI job `secret-scan` in .github/workflows/security.yml.
# Default rules plus an allowlist for the fixture placeholders the e2e/verify
# scripts send on purpose. Historical one-offs (test UUIDs, the ed25519 test
# PEM in worker/src/crypto.rs, a truncated JWT in a handover) are pinned by
# fingerprint in .gitleaksignore instead, so a NEW match in the same file
# still fails. Triaged 2026-09-23: 73 findings, all false positives.
title = "bethere"

[extend]
useDefault = true

[[allowlists]]
description = "Fixture placeholders, never real credentials"
regexTarget = "secret"
regexes = [
  '''^dev-token$''',
  '''^pii-probe-secret''',
  '''^YOUR_[A-Z_]+$''',
]
