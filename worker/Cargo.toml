[package]
name = "event-checkin-worker"
version = "0.1.0"
edition = "2024"
description = "Cloudflare Worker for event-checkin with Axum-on-Workers"

[dependencies]
# Cloudflare Workers SDK
worker = { version = "0.8", features = ["http", "d1"] }

# Web framework (Axum-on-Workers via http feature)
# Note: no tower/axum defaults that pull in tokio — Workers runtime handles async
axum = { version = "0.8", default-features = false, features = [
  "macros",
  "json",
  "query",
  "matched-path",
  "original-uri",
] }
tower-service = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Ed25519 curve check for PDA derivation (fiat backend, no std needed)
curve25519-dalek = { version = "4.1", default-features = false }

# Encoding — WASM-compatible
base64 = "0.22"

# URL encoding — WASM-compatible
urlencoding = "2"

# Form URL encoding (lightweight, replaces heavy `url` crate's re-export)
form_urlencoded = "1"

# Shared domain types
event-checkin-domain = { path = "../domain" }

# WASM/JS interop for SubtleCrypto bridge
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

# UUID generation (v7 for claim tokens)
uuid = { version = "1", features = ["v7", "serde", "js"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Async utilities (join! for concurrent KV reads)
futures-util = "0.3"

# Logging
tracing = "0.1"
console_log = "1"
log = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
