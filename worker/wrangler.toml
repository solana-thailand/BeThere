# Phase 4: Events KV namespace (Issue 004 — multi-event / organizer management)
# P5: Kept in wrangler.toml to match production bindings (Cloudflare versions API
# fails when bindings differ). The binding exists in production but code ignores it —
# all reads/writes go through D1 with KV fallback.
[[kv_namespaces]]
binding = "EVENTS"
id = "c8a6a87f9ed34ce0a3c8e48b84039214"
preview_id = "7d74e1f62fb545be811eaefc8b059dee"

# D1 Database (Issue 037 — claim locks + audit trail)
# Create with: npx wrangler d1 create bethere-db
# Then paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "bethere-db"
database_id = "98d09542-e7d8-4413-ac34-4276a50d126c"
migrations_dir = "migrations"

# R2 bucket for slip images, refund proofs, badge SVGs, NFT metadata (Issue #039).
# Create with: npx wrangler r2 bucket create bethere-assets
[[r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "bethere-assets"

