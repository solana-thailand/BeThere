name = "bethere"
main = "build/worker/shim.mjs"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Static assets — serve the Leptos WASM frontend
# SPA mode: non-API routes fall back to index.html
[assets]
directory = "../frontend-leptos/dist"
not_found_handling = "single-page-application"

# Build configuration for workers-rs (Rust → WASM)
# Manual build instead of worker-build to reduce memory usage.
# Requires: wasm-bindgen CLI matching the crate version (0.2.118)
#
# The shim.mjs is rewritten after wasm-bindgen runs to create a proper
# ES Module entry point. Workers imports WASM as a WebAssembly.Module,
# so we must instantiate it manually before calling __wbg_set_wasm.
[build]
command = """
  mkdir -p build/worker && \
  CARGO_BUILD_JOBS=2 cargo build -p event-checkin-worker --target wasm32-unknown-unknown --release && \
  wasm-bindgen \
    --target bundler \
    --no-typescript \
    --remove-name-section \
    ../target/wasm32-unknown-unknown/release/event_checkin_worker.wasm \
    --out-dir build/worker && \
  cat > build/worker/shim.mjs << 'SHIM'
import * as imports from "./event_checkin_worker_bg.js";
import wasmModule from "./event_checkin_worker_bg.wasm";

const instance = new WebAssembly.Instance(wasmModule, {
  "./event_checkin_worker_bg.js": imports,
});
imports.__wbg_set_wasm(instance.exports);

export default imports;
SHIM
"""

# Environment variables (non-secret config)
[vars]
SERVER_URL = "https://bethere.solana-thailand.workers.dev"
CLAIM_BASE_URL = "https://bethere.solana-thailand.workers.dev/claim"
GOOGLE_SHEET_NAME = "Attendees"
GOOGLE_STAFF_SHEET_NAME = "staff"
PLATFORM_SHEET_ID = "1oF54ia6mquO_kB869aQxmz3RD8nDcTRWfXIX0VmndxM"
DEV_MODE = "0"
DEV_EMAIL = "ratchapon.poc@gmail.com"
SUPER_ADMIN_EMAILS = "ratchapon.poc@gmail.com,hackathon@colosseum.org"

# Phase 3: Event config (change per event without WASM rebuild)
EVENT_NAME = "Solana x AI Builders: The Road to Mainnet #1 (Bangkok)"
EVENT_TAGLINE = "Deep Dive into Rust, AI Agents, and the Solana Ecosystem"
EVENT_LINK = "https://solana-thailand.github.io/genesis/events/road-to-mainnet-1-bangkok/"
EVENT_START_MS = "1777170600000"
EVENT_END_MS = "1777183200000"

# Deposit settings (survive re-seed via POST /api/events/seed)
# EVENT_DEPOSIT_ENABLED = "true"
# EVENT_DEPOSIT_AMOUNT_USDC = "0"
# EVENT_DEPOSIT_AMOUNT_THB = "0"
# EVENT_PROMPTPAY_ID = ""

# Secrets (set via `npx wrangler secret put <NAME>`):
# - JWT_SECRET
# - GOOGLE_CLIENT_ID
# - GOOGLE_CLIENT_SECRET
# - GOOGLE_REDIRECT_URI
# - GOOGLE_SERVICE_ACCOUNT_EMAIL
# - GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY
# - GOOGLE_SERVICE_ACCOUNT_TOKEN_URI
# - GOOGLE_SHEET_ID
# - STAFF_EMAILS
# - PLATFORM_SHEET_ID (env var, not secret — set in [vars])

# Phase 2 secrets (Solana / Helius NFT minting):
# - HELIUS_RPC_URL          (optional — defaults to https://devnet.helius-rpc.com)
# - HELIUS_API_KEY           (required)
# - NFT_COLLECTION_MINT     (optional — Helius mints to its own tree without a collection)
# - NFT_METADATA_URI        (optional — metadata JSON on Arweave/IPFS)
# - NFT_IMAGE_URL           (optional — NFT badge image URL)

# Cron trigger — daily cleanup of expired KV entries (A3 sustainability)
# Runs at 03:00 UTC to delete expired session data, deposits, claim locks,
# and fully-expired event configs per retention policy in cleanup.rs.
[triggers]
crons = ["0 3 * * *"]

# Smart Placement — co-locate Worker close to backends (D1, Google Sheets, Helius RPC)
# Reduces check-in latency by minimizing network round-trips. Zero cost on all plans.
[placement]
mode = "smart"

# Phase 4: Quiz KV namespace — REMOVED (Option C).
# Quiz data is now D1-only. QUIZ KV binding removed from wrangler.toml.
# If needed for rollback, restore:
# [[kv_namespaces]]
# binding = "QUIZ"
# id = "faf9eebaa53d46f9a82c1f6db6dfbc05"
# preview_id = "ec705e432a5b47adae937878c1402174"

# Phase 4: Events KV namespace (Issue 004 — multi-event / organizer management)
# P5: Kept in wrangler.toml to match production bindings (Cloudflare versions API
# fails when bindings differ). The binding exists in production but code ignores it —
# all reads/writes go through D1 with KV fallback.
[[kv_namespaces]]
binding = "EVENTS"
id = "c8a6a87f9ed34ce0a3c8e48b84039214"
preview_id = "7d74e1f62fb545be811eaefc8b059dee"

# D1 Database (Issue 037 — claim locks + audit trail)
# Create with: npx wrangler d1 create bethere-db
# Then paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "bethere-db"
database_id = "98d09542-e7d8-4413-ac34-4276a50d126c"
migrations_dir = "migrations"

# R2 bucket for slip images, refund proofs, badge SVGs, NFT metadata (Issue #039).
# Create with: npx wrangler r2 bucket create bethere-assets
[[r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "bethere-assets"
