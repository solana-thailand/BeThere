# Cron trigger — daily cleanup of expired KV entries (A3 sustainability)
# Runs at 03:00 UTC to delete expired session data, deposits, claim locks,
# and fully-expired event configs per retention policy in cleanup.rs.
[triggers]
crons = ["0 3 * * *"]

# Smart Placement — co-locate Worker close to backends (D1, Google Sheets, Helius RPC)
# Reduces check-in latency by minimizing network round-trips. Zero cost on all plans.
[placement]
mode = "smart"

# Phase 4: Quiz KV namespace — REMOVED (Option C).
# Quiz data is now D1-only. QUIZ KV binding removed from wrangler.toml.
# If needed for rollback, restore:
