[package]
name = "bethere-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP server (stdio) that lets an AI agent find a BeThere event, register, and pay the devnet escrow deposit from its own wallet."
publish = false

# Standalone, like flow-harness: its native Solana deps must never reach the
# worker's wasm32 build. Build with `cd bethere-mcp && cargo build --release`.
[workspace]

[[bin]]
name = "bethere-mcp"
path = "src/main.rs"

[lib]
name = "bethere_mcp"
path = "src/lib.rs"

[dependencies]
# Signing, RPC submit and the SIWS/deposit request shapes. Reused, not copied:
# the harness path is the one that already runs green against staging.
flow-harness = { path = "../flow-harness" }
domain = { package = "event-checkin-domain", path = "../domain", default-features = false }

reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "io-std", "io-util", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
solana-sdk = "2.2"
