[package]
name = "event-checkin-frontend"
version = "0.2.0"
edition = "2024"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[features]
default = ["console_log"]
# Enables browser console logging via console_log crate.
# Disable in release builds to strip all log strings from WASM.
# Build release without logging: trunk build --no-default-features
console_log = ["dep:console_log"]
# Forces all log macros to compile to no-ops, stripping string data from WASM.
# Automatically enabled when console_log is disabled.
release_no_log = ["log/max_level_off"]

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
leptos_meta = { version = "0.8" }
leptos_router = { version = "0.8" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Blob",
  "BlobPropertyBag",
  "Clipboard",
  "Element",
  "File",
  "FileList",
  "HtmlVideoElement",
  "KeyboardEvent",
  "MediaDevices",
  "MediaStream",
  "MediaStreamConstraints",
  "Navigator",
  "Node",
  "Url",
  "Window",
  "HtmlElement",
  "HtmlInputElement",
  "Headers",
  "Performance",
  "Request",
  "RequestCache",
  "RequestInit",
  "RequestMode",
  "Response",
  "Storage",
  "TouchEvent",
  "TouchList",
  "Touch",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gloo-timers = { version = "0.3", features = ["futures"] }
gloo-utils = "0.2"
console_log = { version = "1", optional = true }
log = "0.4"
urlencoding = "2"
# QR code — only the matrix/data structure, not the SVG renderer
qrcode = { version = "0.14", default-features = false }

# Shared domain crate (Plan 014 Phase 2.0 — SSOT prerequisite for wire format).
# Path dep resolves to the workspace sibling; `frontend-leptos` is excluded from
# the workspace Cargo.toml so it builds in isolation under `trunk`, but the path
# is stable relative to the repo root.
# `wire` feature is enabled so the frontend can decode zero-copy `*Wire` payloads
# from `?fmt=bin` endpoints (Plan 014 Phase 1.3+). Existing JSON mirrors in
# `api/types.rs` are deliberately kept — they carry defensive `#[serde(default)]`
# and UI helper methods that the domain types intentionally lack.
event-checkin-domain = { path = "../domain", features = ["wire"] }

# Wire-format primitives — same versions as `domain` (Plan 014 Phase 1.2a).
# Needed directly in the frontend because the decode path runs here (the worker
# encodes, the Leptos client decodes). Both compile cleanly on `wasm32`.
bytemuck = { version = "1", features = ["derive"] }
blake3 = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
