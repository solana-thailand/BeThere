[package]
name = "event-checkin-frontend"
version = "0.2.0"
edition = "2024"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[features]
default = ["console_log"]
# Enables browser console logging via console_log crate.
# Disable in release builds to strip all log strings from WASM.
console_log = ["dep:console_log"]

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
leptos_meta = { version = "0.8" }
leptos_router = { version = "0.8" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Blob",
  "BlobPropertyBag",
  "Clipboard",
  "Element",
  "HtmlVideoElement",
  "KeyboardEvent",
  "MediaDevices",
  "MediaStream",
  "MediaStreamConstraints",
  "Navigator",
  "Node",
  "Url",
  "Window",
  "HtmlElement",
  "HtmlInputElement",
  "Headers",
  "Performance",
  "Request",
  "RequestInit",
  "RequestMode",
  "Response",
  "TouchEvent",
  "TouchList",
  "Touch",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gloo = { version = "0.11", features = ["futures"] }
console_log = { version = "1", optional = true }
log = "0.4"
urlencoding = "2"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
