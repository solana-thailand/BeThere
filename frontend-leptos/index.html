        <link data-trunk rel="copy-dir" href="globe" />

        <!-- PWA — Service worker boot. Trunk copy-file puts sw.js in dist/. -->
        <link data-trunk rel="copy-file" href="sw.js" />
        <!-- Cache-control for static assets (_headers is parsed by Workers Assets,
             not served). Forces a fresh index.html/sw.js on every load so a
             stale shell can't reference purged, content-hashed JS/WASM (the
             blank-page-after-deploy bug). Hashed assets cache forever. -->
        <link data-trunk rel="copy-file" href="_headers" />
        <!-- Serves staff-app.html (the staff shell) for the staff paths. -->
        <link data-trunk rel="copy-file" href="_redirects" />
        <!-- Written inline for readability, but it does not ship inline: the
             CSP has no script-src 'unsafe-inline', so Trunk's post_build hook
             (externalize_inline_scripts.py) moves it and Trunk's loader into
             hashed, SRI-pinned /inline-*.js files. `defer` is inert inline and
             takes effect once it is external, so the fetch never blocks the
             parser; the script only adds a load listener. -->
        <script defer>
            if ("serviceWorker" in navigator) {
                window.addEventListener("load", function () {
                    navigator.serviceWorker
                        .register("/sw.js", { updateViaCache: "none" })
                        .then(function (reg) {
                            console.log(
                                "[sw] registered with scope:",
                                reg.scope,
                            );
                        })
                        .catch(function (err) {
                            console.warn("[sw] registration failed:", err);
                        });
                });
            }
        </script>
