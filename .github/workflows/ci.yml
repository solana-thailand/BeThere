name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build-test:
    name: check + clippy + test (domain, worker)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch; SHA-pinned, so `toolchain:` must be explicit
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Stub frontend dist for worker include_str!
        # `worker/src/lib.rs` does `include_str!("../../frontend-leptos/dist/index.html")`
        # for the SPA fallback. `frontend-leptos/` is gitignored and excluded from the
        # cargo workspace, so a fresh checkout has no dist. CI only needs the file to
        # *exist* for `include_str!` to resolve — it does not validate frontend output
        # here (frontend is a separate WASM project built by trunk in deploy.sh).
        run: |
          mkdir -p frontend-leptos/dist
          printf '<!DOCTYPE html><html><head><title>ci-stub</title></head><body></body></html>\n' \
            > frontend-leptos/dist/index.html

      - name: cargo fmt --check (workspace)
        # The tree was brought fully rustfmt-clean; this keeps it that way rather
        # than letting drift accumulate into another repo-wide reformat commit.
        # Covers `domain` and `worker` — the whole workspace.
        #
        # It does NOT cover frontend-leptos, which the root Cargo.toml `exclude`s;
        # `--all` means "all workspace members", not "all crates in the tree". That
        # crate is gated separately in the frontend-clippy job below (.issues/092).
        run: cargo fmt --all -- --check

      - name: cargo check (workspace)
        run: cargo check --workspace --locked --all-targets

      - name: cargo clippy (workspace, -D warnings)
        run: cargo clippy --workspace --locked --all-targets -- -D warnings

      - name: cargo test (workspace)
        # Output is saved for the floor gate below. pipefail is explicit because
        # a bare `run:` is `bash -e`, so a failing `cargo test | tee` would exit 0.
        run: |
          set -o pipefail
          cargo test --workspace --locked 2>&1 | tee "$RUNNER_TEMP/test-workspace.log"

      - name: cargo test (domain zero-alloc audit, wire + alloc_count)
        # domain/tests/alloc_count.rs is `#![cfg(feature = "alloc_count")]`, so
        # the workspace run above compiles it to 0 tests. Until 2026-09-23 no CI
        # step enabled the feature and the audit never ran. One thread: the
        # allocation counter is process-global.
        run: |
          set -o pipefail
          cargo test -p event-checkin-domain --locked --features wire,alloc_count \
            --test alloc_count -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/test-alloc-count.log"

      - name: Test-count floors (workspace)
        # Plan 030 green-zero guard. `test result: ok. 0 passed` exits 0, so a
        # test file that stops running (a dropped `mod`, a feature never
        # enabled) reads as green. Each binary must pass at least its count in
        # scripts/verify/test_floors.json; lowering one takes --allow-decrease
        # in a commit that says why.
        run: |
          python3 scripts/verify/test_count_floor.py --self-test
          python3 scripts/verify/test_count_floor.py --suite workspace "$RUNNER_TEMP/test-workspace.log"
          python3 scripts/verify/test_count_floor.py --suite domain-alloc-count "$RUNNER_TEMP/test-alloc-count.log"

      - name: Security and notification SQL behavior
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -m unittest discover -s worker/tests/security -v
          python3 -m unittest discover -s worker/tests/notifications -v

  wasm-build:
    name: worker wasm32 build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Rust (stable, wasm32 target)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch; SHA-pinned, so `toolchain:` must be explicit
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Stub frontend dist for worker include_str!
        # Same reason as build-test: worker/src/lib.rs include_str!s the SPA shell
        # from the gitignored frontend-leptos/dist. The file only needs to exist.
        run: |
          mkdir -p frontend-leptos/dist
          printf '<!DOCTYPE html><html><head><title>ci-stub</title></head><body></body></html>\n' \
            > frontend-leptos/dist/index.html

      - name: cargo build worker (wasm32-unknown-unknown)
        # The worker ships to Cloudflare as wasm32. build-test only checks the
        # native target, so code that compiles native but breaks on wasm32
        # (platform-gated APIs, non-wasm deps) would otherwise slip through to
        # `deploy.sh` and fail mid-build. --locked mirrors the deploy toolchain.
        run: cargo build -p event-checkin-worker --target wasm32-unknown-unknown --locked --release

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: worker/pnpm-lock.yaml

      - name: Install worker node deps
        # Needed for `wrangler deploy --dry-run`, which is how the size gate
        # gets a bundle. The [alias] block in wrangler.toml points esbuild at
        # exact paths under node_modules, so --frozen-lockfile is required for
        # those to resolve.
        working-directory: worker
        run: pnpm install --frozen-lockfile

      - name: Install wasm-bindgen CLI
        # Pinned to the crate version; wasm-bindgen's CLI and crate halves must
        # match exactly or the bindgen step fails with a schema error.
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: wasm-bindgen-cli@0.2.118

      - name: Worker upload-size budget
        # Cloudflare enforces the Worker limit on the COMPRESSED bundle, and
        # this account is on the free plan: 3 MiB after gzip. Until 2026-09-22
        # nothing measured it — this job built the wasm and discarded the
        # number, and deploy.sh had no check at all, so "does it still fit?"
        # was answered by guessing. Measured 2026-09-22: 1,557,187 bytes gzip,
        # 49.5% of the ceiling.
        #
        # The gate measures wrangler's own dry-run bundle (shim.js + wasm) —
        # exactly what gets uploaded — and fails at 85% of the ceiling so the
        # wall is hit in a PR and not during a deploy. Thresholds live in
        # worker/.size-budget.
        env:
          WRANGLER_SEND_METRICS: "false"
        run: bash scripts/verify/worker_size_budget.sh

  frontend-clippy:
    name: frontend wasm32 clippy + native tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `frontend-leptos` is EXCLUDED from the cargo workspace (see root Cargo.toml),
    # so build-test never touches it — a frontend change that doesn't compile (or
    # regresses clippy) only surfaced at `deploy.sh` build time. This job clippy-checks
    # the frontend for its real ship target (wasm32); clippy also compiles, so it
    # subsumes a plain `cargo check` and enforces the -D warnings policy.
    # The frontend also carries native (non-wasm) tests — notably the SSOT mirror
    # audit in `tests/`, which guards the frontend's mirror types against domain
    # drift. Clippy compiles but never runs them, and the crate is outside the
    # workspace, so `cargo test` here is the only thing that executes them; a
    # module split once broke that audit and nothing in CI noticed. The
    # #[wasm_bindgen_test] cases still need wasm-pack and stay out of scope.
    defaults:
      run:
        working-directory: frontend-leptos
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Rust (stable, wasm32 target)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch; SHA-pinned, so `toolchain:` must be explicit
        with:
          toolchain: stable
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: frontend-leptos

      - name: cargo fmt --check (frontend)
        # The workspace fmt gate cannot reach this crate — it is `exclude`d from
        # the workspace, so `cargo fmt --all` at the root skips it entirely and
        # six files had drifted unnoticed by 2026-09-13 (.issues/092).
        #
        # The exclusion was previously justified by rustfmt hard-erroring on
        # whitespace-only lines inside Leptos `view!` macros. That does not
        # reproduce on the current toolchain: `cargo fmt` here exits 0, writes
        # only ordinary formatting, is idempotent on a second pass, and leaves
        # clippy -D warnings and the native tests green. If a future rustfmt
        # regresses on `view!`, delete this step rather than reformatting
        # around it — and say so here.
        run: cargo fmt --check

      - name: cargo clippy (frontend, wasm32, -D warnings)
        run: cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings

      - name: cargo test (frontend, host target)
        # Host target on purpose: these are plain #[test] cases, and the wasm32
        # target has no test runner on the runner box.
        run: |
          set -o pipefail
          cargo test --locked 2>&1 | tee "$RUNNER_TEMP/test-frontend.log"

      - name: Test-count floors (frontend)
        # Plan 030 green-zero guard; see the workspace step in build-test.
        run: python3 ../scripts/verify/test_count_floor.py --suite frontend "$RUNNER_TEMP/test-frontend.log"

  e2e:
    name: playwright e2e (SPA served by the worker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The five specs in `e2e/` were never wired into CI, so a frontend regression
    # that still compiles (a renamed CSS hook, a dead route, a broken auth guard)
    # only surfaced in a browser. frontend-clippy compiles the SPA but never runs it.
    #
    # Topology mirrors production rather than `trunk serve`: the worker's [assets]
    # block serves `frontend-leptos/dist` with SPA fallback, so one origin on 8788
    # answers both the app and /api. That means /claim/<bad-token> gets a real 404
    # from a real handler instead of a proxy error, which is what claim.spec.ts asserts.
    #
    # No secrets: every spec is unauthenticated, `wrangler dev --local` simulates
    # D1/KV/R2 in-process, and `.dev.vars` is absent. Verified locally that the run
    # makes zero `sheets::` calls — nothing in this job can reach a live Google Sheet.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Rust (stable, wasm32 target)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch; SHA-pinned, so `toolchain:` must be explicit
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            .
            frontend-leptos

      - name: Install trunk + wasm-bindgen-cli
        # trunk builds the Leptos SPA; wasm-bindgen is invoked directly by the
        # worker's [build] command in wrangler.toml and must be on PATH at the
        # exact crate version (a mismatch fails the bindgen step, not the build).
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: trunk@0.21.7,wasm-bindgen-cli@0.2.118

      - name: Build frontend (trunk)
        # Trunk.toml sets release = true, so this is the shipped artifact.
        working-directory: frontend-leptos
        run: trunk build

      - name: Frontend first-load size budget
        # The sibling of wasm-build's worker size gate. This is the only job
        # that builds the SPA, so it is the only place the frontend can be
        # measured — and until 2026-09-22 nothing measured it at all, while the
        # worker had a gate. The frontend is the bigger of the two.
        #
        # `--dir` rather than `--build`: trunk has already produced the bundle
        # above, and --dir also skips the staleness check, which is meaningless
        # on a fresh checkout where every mtime is identical.
        #
        # Verified locally that a plain `trunk build` dist and a `build.sh` dist
        # measure within 4 bytes of each other, so the baseline recorded from
        # build.sh does not spuriously red this step.
        run: bash scripts/verify/frontend_size_budget.sh --dir frontend-leptos/dist

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: worker/pnpm-lock.yaml

      - name: Install worker node deps
        working-directory: worker
        run: pnpm install --frozen-lockfile

      - name: Install Playwright chromium
        working-directory: worker
        run: pnpm exec playwright install --with-deps chromium

      - name: Start worker (wrangler dev --local)
        working-directory: worker
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          nohup pnpm exec wrangler dev --local --port 8788 > /tmp/wrangler-dev.log 2>&1 &
          for _ in $(seq 1 150); do
            if curl -sf http://localhost:8788/api/health > /dev/null; then
              echo "worker ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::worker did not answer /api/health within 300s"
          cat /tmp/wrangler-dev.log
          exit 1

      - name: Run Playwright specs
        working-directory: worker
        env:
          BASE_URL: http://localhost:8788
        run: pnpm exec playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: worker/playwright-report/
          retention-days: 7

      - name: Worker log on failure
        if: failure()
        run: cat /tmp/wrangler-dev.log

  escrow-tests:
    name: escrow SVM tests (quasar)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Override the workflow-level RUSTFLAGS: -D warnings. `quasar build` generates
      # bethere-escrow-client with camelCase IDL field names (non_snake_case), which
      # -D warnings would turn into hard errors. That is generated code we do not own,
      # so build this job the way `quasar test` builds locally — without -D warnings.
      RUSTFLAGS: ""
    # bethere-escrow is the on-chain Solana program (Quasar framework), a standalone
    # cargo project outside the worker workspace — the other jobs never touch it. This
    # job builds the SBF program and runs the host-level SVM test suite so the escrow's
    # money-path verification is enforced on every change. Deps are pinned (Cargo.lock +
    # quasar rev) for a reproducible build.
    # NOTE: Kani formal proofs (cargo kani) are NOT run here — the Kani toolchain is a
    # large download and slow; enforcing the proofs is a follow-up (likely a scheduled job).
    defaults:
      run:
        working-directory: bethere-escrow
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch; SHA-pinned, so `toolchain:` must be explicit
        with:
          toolchain: stable
      # No rust-cache here: the dev-dep `bethere-escrow-client` is a path dep under
      # target/ generated by `quasar build`, so `cargo metadata` fails until the build
      # runs — rust-cache would error and cache nothing.

      - name: Install Solana (Agave) toolchain
        # Provides cargo-build-sbf (the SBF compiler quasar build shells out to).
        # Pinned to 3.1.10 to match the local dev toolchain.
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v3.1.10/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install quasar CLI
        # quasar build also generates the dev-dep client (target/client/), so cargo-build-sbf
        # alone is insufficient — the quasar CLI is required. Install the published crates.io
        # release (0.0.0) — the same build the local dev toolchain uses; its config schema
        # (defaults.framework) differs from the git-HEAD CLI's (defaults.rust_framework).
        run: cargo install quasar-cli --version 0.0.0

      - name: Configure quasar (global defaults)
        # Fresh runners have no ~/.quasar/config.toml, so quasar test aborts with
        # "run quasar config reset and re-init". Seed the defaults the project needs.
        run: |
          quasar config reset
          quasar config set defaults.toolchain solana
          quasar config set defaults.framework quasarsvm-rust
          quasar config set defaults.template full

      - name: quasar test (build SBF program + run SVM suite)
        run: quasar test

  deploy-scripts:
    name: shellcheck + deploy fallback tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: ShellCheck every tracked shell script
        # `worker/deploy.sh` used to embed Python inside double-quoted
        # `python3 -c` arguments, so backticks in the Python comments ran as
        # shell commands — one of them was a literal `wrangler deploy`
        # (Issue #065). The gate is fail-closed: it checks every .sh in the
        # repo minus an explicit deferral list, so a new script is covered
        # automatically. See scripts/verify/shellcheck_gate.sh.
        env:
          # Pinned. Ubuntu's packaged ShellCheck lags, and the versions disagree:
          # < 0.11 reports trap/indirect-call findings as SC2317 where 0.11
          # reports SC2329, so an unpinned CI can red a gate that is green on a
          # developer's machine (and vice versa). The gate prints the version it
          # ran, so a future mismatch is visible in the log rather than puzzling.
          SHELLCHECK_VERSION: v0.11.0
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ --strip-components=1 -C /usr/local/bin "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          bash scripts/verify/shellcheck_gate.sh

      - name: Setup Python (3.11+ for tomllib)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: e2e helper library smoke test
        # `scripts/e2e/` is run by hand against devnet, so nothing else in CI
        # would notice a break in the helpers its eight scripts now share
        # (Issue #076). This covers the parts that need no chain: the tallies,
        # the JSON assertion, and that every script still resolves the helpers
        # it calls.
        run: bash scripts/verify/e2e_lib_smoke.sh

      - name: Issue / plan / handover numbering gate
        # Plan 030. Concurrent sessions numbered files by eye and collided
        # (plan 014, handovers 001/124/126 are pinned legacy cases). The
        # self-test runs first so a gate that can no longer fail goes red too.
        run: |
          python3 scripts/verify/numbering_gate.py --self-test
          python3 scripts/verify/numbering_gate.py

      - name: Issue Status verdict vocabulary
        # Plan 030. Issues above 144 must open Status with a fixed verdict word
        # so stale prose is machine-checkable (.issues/140). --vocab needs no git
        # history, so the shallow checkout is enough.
        run: |
          python3 scripts/verify/issue_ledger.py --self-test
          python3 scripts/verify/issue_ledger.py --vocab

      - name: Install blake3 (wrangler-compatible asset hashing)
        run: python3 -m pip install --quiet blake3

      - name: Event invariant rules self-test
        # Issue 089. Nearly every defect found on 2026-09-13 was two columns
        # contradicting each other with nothing checking — and two of them were
        # found by people outside the team reading our database.
        #
        # CI verifies the *auditor*, not a live database: staging is
        # deliberately full of harness fixtures in contradictory states, and
        # production findings are often intentional organizer choices, so
        # pointing the gate at either would make it permanently red and
        # therefore unread. Each rule is instead exercised both ways against an
        # in-memory fixture — it must fire on a violating row and stay silent
        # on a clean one. A rule that can only ever pass is not a rule
        # (.issues/072).
        #
        # Run the audit itself against real data by hand:
        #   python3 scripts/verify/event_invariants_audit.py --db bethere-db
        run: python3 scripts/verify/event_invariants_audit.py --self-test

      - name: Deploy fallback unit tests
        # MIME mapping (a wrong Content-Type took the frontend down on
        # 2026-07-26) and metadata binding completeness against the real
        # wrangler.toml, so the fallback cannot silently drift from it again.
        env:
          PYTHONPATH: worker/scripts
        run: python3 -m unittest discover -s tests/deploy_fallback -t tests/deploy_fallback -v
