name: Security

# Supply-chain and secret gates (.plans/029 §2). Each step is the same command
# you run locally — see the header of deny.toml and .gitleaks.toml.
#
# Scheduled weekly as well: a new RUSTSEC advisory lands without any code
# change, so a push-only advisory gate goes stale while staying green.

on:
  push:
    branches: [develop, main]
  pull_request:
  schedule:
    - cron: "17 2 * * 1" # Mondays 02:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Pinned binary + checksum instead of gitleaks-action, which needs a paid
      # license on organization repos. Bump both lines together.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (checksum-verified)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          ./gitleaks version

      - name: Scan every commit
        # 1,312 commits scan in ~1 s locally (2026-09-23). Historical false
        # positives are fingerprinted in .gitleaksignore.
        run: ./gitleaks git --config .gitleaks.toml --redact --no-banner .

  advisories:
    name: cargo-deny advisories (${{ matrix.manifest }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        manifest: [Cargo.toml, frontend-leptos/Cargo.toml]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install cargo-deny
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: cargo-deny@0.20.2

      - name: cargo deny check advisories
        run: cargo deny --manifest-path ${{ matrix.manifest }} --config deny.toml check advisories

      # Separate step so a licence failure still reports when advisories fail
      # (.plans/031 §2). The job keeps its name; required checks key on it.
      - name: cargo deny check licenses
        if: success() || failure()
        run: cargo deny --manifest-path ${{ matrix.manifest }} --config deny.toml check licenses

  advisories-escrow:
    # bethere-escrow's graph cannot resolve without `quasar build` (a dev-dep
    # lives under its target/), so scan the lockfile directly. The ignore ids
    # come from deny.toml — one list for both tools.
    name: cargo-audit advisories (bethere-escrow/Cargo.lock)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install cargo-audit
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: cargo-audit@0.22.2

      - name: cargo audit (ignores from deny.toml)
        run: |
          set -euo pipefail
          args=()
          while read -r id; do args+=(--ignore "$id"); done \
            < <(grep -oE 'RUSTSEC-[0-9]+-[0-9]+' deny.toml)
          [ "${#args[@]}" -gt 0 ] || { echo "no ignore ids parsed from deny.toml"; exit 1; }
          cargo audit --file bethere-escrow/Cargo.lock --deny warnings "${args[@]}"

  third-party-notices:
    # THIRD_PARTY_LICENSES.md must match the lockfiles (.plans/031 §2). A dep
    # bump without a regenerated file fails here; the licence *gate* is the
    # `cargo deny check licenses` step above.
    name: third-party notices current
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install cargo-about
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: cargo-about@0.9.2

      - name: Fetch both graphs
        run: |
          cargo fetch --locked --manifest-path Cargo.toml
          cargo fetch --locked --manifest-path frontend-leptos/Cargo.toml

      - name: Self-test and check
        run: |
          scripts/verify/third_party_licenses.sh --self-test
          scripts/verify/third_party_licenses.sh --check
