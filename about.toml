# cargo-about — third-party notices for the two wasm artifacts we serve
# (worker bundle, frontend-leptos dist). Generated by
# scripts/licenses/third_party_licenses.sh; keep `accepted` in step with
# [licenses].allow in deny.toml, which is the gate.
accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "Unicode-3.0",
  "Zlib",
]
targets = ["wasm32-unknown-unknown"]
# Build scripts and dev/test deps are not in the shipped wasm.
ignore-build-dependencies = true
ignore-dev-dependencies = true
# First-party crates are `publish = false`.
private = { ignore = true }
